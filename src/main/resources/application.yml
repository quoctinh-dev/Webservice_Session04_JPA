pageSize: 2
server:
    port: 9999
spring:
    application:
        name: Webservice_Session04_JPA
    datasource:
        driver-class-name: org.postgresql.Driver
        password: 1234$
        url: ${SPRING_DATASOURCE_URL}
        username: postgres
    jpa:
        hibernate:
            ddl-auto: update
        properties:
            hibernate:
                dialect: org.hibernate.dialect.PostgreSQLDialect
                format_sql: true
        show-sql: true
